<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CYBER DEFENDER: Protocol Invaders | Arvss07 Arcade</title>
  <style>
    :root {
      --bg: #000000;
      --paper: #FCFCFC;
      --blue: #0058F8;
      --blue-glow: #3C8CFC;
      --red: #F83800;
      --tint: #0B2B6B;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background-color: var(--bg);
      color: var(--paper);
      font-family: 'Courier New', Courier, monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      touch-action: manipulation;
    }
    #cabinet {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px;
      border: 4px solid var(--paper);
      background: #050b14;
      box-shadow: 0 0 20px rgba(0, 88, 248, 0.4), inset 0 0 15px rgba(0, 0, 0, 0.9);
      max-width: 100vw;
    }
    #marquee {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      background: var(--blue);
      color: var(--paper);
      padding: 6px 12px;
      margin-bottom: 8px;
      border: 2px solid var(--paper);
      font-weight: bold;
      font-size: 13px;
      letter-spacing: 1px;
    }
    #marquee .title {
      color: var(--paper);
      text-shadow: 2px 2px #000;
    }
    #marquee .links a {
      color: #A8C4FC;
      text-decoration: none;
      margin-left: 10px;
      font-size: 11px;
    }
    #marquee .links a:hover {
      color: #fff;
      text-decoration: underline;
    }
    #screen-wrap {
      position: relative;
      border: 4px solid #1a2638;
      background: #000;
      line-height: 0;
    }
    canvas {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      display: block;
      width: 640px;
      height: 480px;
      max-width: 95vw;
      max-height: 65vh;
      object-fit: contain;
    }
    /* CRT Scanline overlay */
    .crt-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.35) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
      background-size: 100% 4px, 6px 100%;
    }
    #controls-hint {
      margin-top: 8px;
      font-size: 11px;
      color: #A8C4FC;
      text-align: center;
      letter-spacing: 0.5px;
    }
    /* On-Screen Mobile Gamepad */
    #mobile-controls {
      display: none;
      width: 100%;
      max-width: 640px;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
      padding: 0 10px;
    }
    @media (pointer: coarse) {
      #mobile-controls {
        display: flex;
      }
      #controls-hint {
        display: none;
      }
    }
    .pad-btn {
      background: #111e33;
      color: var(--paper);
      border: 2px solid var(--blue-glow);
      font-size: 18px;
      font-weight: bold;
      width: 60px;
      height: 54px;
      border-radius: 6px;
      touch-action: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .pad-btn:active, .pad-btn.pressed {
      background: var(--red);
      border-color: var(--paper);
    }
    .fire-btn {
      background: #4a0f02;
      border-color: var(--red);
      width: 80px;
      height: 54px;
      font-size: 14px;
    }
    .dpad-group {
      display: flex;
      gap: 10px;
    }
  </style>
</head>
<body>

  <div id="cabinet">
    <div id="marquee">
      <span class="title">🕹️ CYBER DEFENDER v1.0</span>
      <div class="links">
        <a href="../README.md">← RETURN TO PROFILE</a>
        <a href="https://github.com/Arvss07" target="_blank">GITHUB</a>
      </div>
    </div>

    <div id="screen-wrap">
      <canvas id="game" width="320" height="240"></canvas>
      <div class="crt-overlay"></div>
    </div>

    <div id="controls-hint">
      [← / →] MOVE &nbsp;&bull;&nbsp; [SPACE] FIRE ANTIMALWARE BEAM &nbsp;&bull;&nbsp; [M] MUTE SOUND &nbsp;&bull;&nbsp; [ENTER] START/PAUSE
    </div>

    <div id="mobile-controls">
      <div class="dpad-group">
        <button class="pad-btn" id="btn-left">◀</button>
        <button class="pad-btn" id="btn-right">▶</button>
      </div>
      <button class="pad-btn fire-btn" id="btn-fire">FIRE</button>
    </div>
  </div>

  <script>
    // --- 8-BIT AUDIO SYNTHESIZER (Web Audio API) ---
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let actx = null;
    let soundEnabled = true;

    function initAudio() {
      if (!actx) actx = new AudioCtx();
      if (actx.state === 'suspended') actx.resume();
    }

    function playTone(freq, type = 'square', duration = 0.08, vol = 0.15) {
      if (!soundEnabled || !actx) return;
      try {
        const osc = actx.createOscillator();
        const gain = actx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, actx.currentTime);
        gain.gain.setValueAtTime(vol, actx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + duration);
        osc.connect(gain);
        gain.connect(actx.destination);
        osc.start();
        osc.stop(actx.currentTime + duration);
      } catch (e) {}
    }

    function soundLaser() {
      if (!soundEnabled || !actx) return;
      try {
        const osc = actx.createOscillator();
        const gain = actx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(880, actx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(110, actx.currentTime + 0.12);
        gain.gain.setValueAtTime(0.12, actx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, actx.currentTime + 0.12);
        osc.connect(gain);
        gain.connect(actx.destination);
        osc.start();
        osc.stop(actx.currentTime + 0.12);
      } catch (e) {}
    }

    function soundExplode() {
      if (!soundEnabled || !actx) return;
      try {
        const osc = actx.createOscillator();
        const gain = actx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(140, actx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(30, actx.currentTime + 0.25);
        gain.gain.setValueAtTime(0.2, actx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, actx.currentTime + 0.25);
        osc.connect(gain);
        gain.connect(actx.destination);
        osc.start();
        osc.stop(actx.currentTime + 0.25);
      } catch (e) {}
    }

    function soundPowerup() {
      if (!soundEnabled || !actx) return;
      [330, 440, 550, 660].forEach((f, i) => {
        setTimeout(() => playTone(f, 'square', 0.07, 0.12), i * 60);
      });
    }

    // --- GAME ENGINE ---
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const W = 320;
    const H = 240;

    let gameState = 'START'; // START, PLAY, GAMEOVER, VICTORY
    let score = 0;
    let highScore = parseInt(localStorage.getItem('arvss_high_score') || '0', 10);
    let wave = 1;
    let lives = 3;

    // Keys
    const keys = { left: false, right: false, fire: false };

    // Player Terminal
    const player = {
      x: W / 2 - 10,
      y: H - 24,
      w: 20,
      h: 12,
      speed: 3,
      cooldown: 0,
      shield: false
    };

    let bullets = [];
    let enemyBullets = [];
    let enemies = [];
    let particles = [];
    let powerups = [];

    // Enemy movement direction
    let enemyDir = 1;
    let enemyStepDown = false;
    let enemySpeed = 0.5;

    // Spawn waves
    function spawnWave() {
      enemies = [];
      const rows = 3 + Math.min(2, Math.floor(wave / 2));
      const cols = 8;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const type = r === 0 ? 'ROOTKIT' : (r === 1 ? 'TROJAN' : 'DDOS');
          enemies.push({
            x: 40 + c * 28,
            y: 35 + r * 20,
            w: 16,
            h: 12,
            type,
            hp: type === 'ROOTKIT' ? 2 : 1,
            color: type === 'ROOTKIT' ? '#F83800' : (type === 'TROJAN' ? '#3C8CFC' : '#FCFCFC')
          });
        }
      }
      enemySpeed = 0.5 + wave * 0.15;
    }

    function resetGame() {
      score = 0;
      wave = 1;
      lives = 3;
      player.x = W / 2 - 10;
      bullets = [];
      enemyBullets = [];
      particles = [];
      powerups = [];
      spawnWave();
      gameState = 'PLAY';
    }

    // Input handlers
    window.addEventListener('keydown', (e) => {
      initAudio();
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
      if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
      if (e.code === 'Space') {
        keys.fire = true;
        if (gameState === 'START' || gameState === 'GAMEOVER') resetGame();
      }
      if (e.code === 'Enter') {
        if (gameState === 'START' || gameState === 'GAMEOVER') resetGame();
        else if (gameState === 'PLAY') gameState = 'PAUSE';
        else if (gameState === 'PAUSE') gameState = 'PLAY';
      }
      if (e.code === 'KeyM') {
        soundEnabled = !soundEnabled;
      }
    });

    window.addEventListener('keyup', (e) => {
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
      if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
      if (e.code === 'Space') keys.fire = false;
    });

    // Mobile buttons
    function bindTouch(id, key) {
      const el = document.getElementById(id);
      const press = (e) => { e.preventDefault(); initAudio(); keys[key] = true; el.classList.add('pressed'); if (gameState !== 'PLAY') resetGame(); };
      const release = (e) => { e.preventDefault(); keys[key] = false; el.classList.remove('pressed'); };
      el.addEventListener('touchstart', press);
      el.addEventListener('touchend', release);
      el.addEventListener('mousedown', press);
      el.addEventListener('mouseup', release);
    }
    bindTouch('btn-left', 'left');
    bindTouch('btn-right', 'right');
    bindTouch('btn-fire', 'fire');

    // Particle explosions
    function explode(x, y, color, count = 12) {
      for (let i = 0; i < count; i++) {
        particles.push({
          x, y,
          vx: (Math.random() - 0.5) * 4,
          vy: (Math.random() - 0.5) * 4,
          life: 18 + Math.random() * 8,
          color
        });
      }
    }

    // --- MAIN LOOP ---
    function update() {
      if (gameState !== 'PLAY') return;

      // Player move
      if (keys.left && player.x > 8) player.x -= player.speed;
      if (keys.right && player.x < W - player.w - 8) player.x += player.speed;

      // Player shoot
      if (player.cooldown > 0) player.cooldown--;
      if (keys.fire && player.cooldown === 0) {
        bullets.push({ x: player.x + player.w / 2 - 2, y: player.y - 4, w: 3, h: 8, vy: -5 });
        player.cooldown = 12;
        soundLaser();
      }

      // Update bullets
      bullets.forEach((b) => b.y += b.vy);
      bullets = bullets.filter((b) => b.y > 0);

      // Enemy logic
      let hitEdge = false;
      enemies.forEach((e) => {
        e.x += enemyDir * enemySpeed;
        if (e.x < 10 || e.x > W - e.w - 10) hitEdge = true;

        // Random enemy fire
        if (Math.random() < 0.003 + wave * 0.001) {
          enemyBullets.push({ x: e.x + e.w / 2, y: e.y + e.h, w: 2, h: 6, vy: 2 + wave * 0.2 });
        }
      });

      if (hitEdge) {
        enemyDir *= -1;
        enemies.forEach((e) => e.y += 8);
      }

      // Enemy bullets
      enemyBullets.forEach((eb) => eb.y += eb.vy);
      enemyBullets = enemyBullets.filter((eb) => eb.y < H);

      // Collisions: Player bullets vs Enemies
      bullets.forEach((b, bi) => {
        enemies.forEach((e, ei) => {
          if (b.x < e.x + e.w && b.x + b.w > e.x && b.y < e.y + e.h && b.y + b.h > e.y) {
            b.dead = true;
            e.hp--;
            if (e.hp <= 0) {
              e.dead = true;
              explode(e.x + e.w / 2, e.y + e.h / 2, e.color, 14);
              soundExplode();
              score += e.type === 'ROOTKIT' ? 50 : (e.type === 'TROJAN' ? 30 : 15);
              if (score > highScore) {
                highScore = score;
                localStorage.setItem('arvss_high_score', highScore);
              }
              // Chance of powerup
              if (Math.random() < 0.1) {
                powerups.push({ x: e.x, y: e.y, vy: 1.5, type: 'SHIELD' });
              }
            } else {
              explode(b.x, b.y, '#fff', 4);
              playTone(220, 'square', 0.04);
            }
          }
        });
      });
      bullets = bullets.filter((b) => !b.dead);
      enemies = enemies.filter((e) => !e.dead);

      // Collisions: Enemy bullets vs Player
      enemyBullets.forEach((eb) => {
        if (eb.x < player.x + player.w && eb.x + eb.w > player.x && eb.y < player.y + player.h && eb.y + eb.h > player.y) {
          eb.dead = true;
          explode(player.x + player.w / 2, player.y + player.h / 2, '#F83800', 20);
          soundExplode();
          lives--;
          if (lives <= 0) {
            gameState = 'GAMEOVER';
          }
        }
      });
      enemyBullets = enemyBullets.filter((eb) => !eb.dead);

      // Check enemies reach bottom
      enemies.forEach((e) => {
        if (e.y + e.h >= player.y) {
          gameState = 'GAMEOVER';
        }
      });

      // Wave clear
      if (enemies.length === 0) {
        wave++;
        soundPowerup();
        spawnWave();
      }

      // Particles
      particles.forEach((p) => {
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
      });
      particles = particles.filter((p) => p.life > 0);
    }

    // --- RENDER ---
    function draw() {
      // Clear screen
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, W, H);

      // Starfield / Grid background
      ctx.fillStyle = '#0B2B6B';
      for (let i = 0; i < 20; i++) {
        const sx = (i * 37) % W;
        const sy = (i * 47 + (Date.now() / 50)) % H;
        ctx.fillRect(sx, sy, 2, 2);
      }

      // Top HUD
      ctx.fillStyle = '#FCFCFC';
      ctx.font = '10px "Courier New", monospace';
      ctx.fillText(`SCORE: ${score}`, 10, 16);
      ctx.fillText(`HI: ${highScore}`, 120, 16);
      ctx.fillText(`WAVE: ${wave}`, 210, 16);
      ctx.fillStyle = '#F83800';
      ctx.fillText(`HP: ${'♥'.repeat(Math.max(0, lives))}`, 270, 16);

      // Draw Player Terminal
      ctx.fillStyle = '#0058F8';
      ctx.fillRect(player.x, player.y + 4, player.w, player.h - 4);
      ctx.fillStyle = '#3C8CFC';
      ctx.fillRect(player.x + 4, player.y, player.w - 8, 4);
      ctx.fillStyle = '#FCFCFC';
      ctx.fillRect(player.x + 8, player.y + 6, 4, 3);

      // Draw Bullets
      ctx.fillStyle = '#F83800';
      bullets.forEach((b) => ctx.fillRect(b.x, b.y, b.w, b.h));

      // Draw Enemy Bullets
      ctx.fillStyle = '#3C8CFC';
      enemyBullets.forEach((eb) => ctx.fillRect(eb.x, eb.y, eb.w, eb.h));

      // Draw Enemies
      enemies.forEach((e) => {
        ctx.fillStyle = e.color;
        // 8-bit invader sprite shape
        ctx.fillRect(e.x + 2, e.y, e.w - 4, 2);
        ctx.fillRect(e.x, e.y + 2, e.w, 6);
        ctx.fillRect(e.x + 2, e.y + 8, 3, 4);
        ctx.fillRect(e.x + e.w - 5, e.y + 8, 3, 4);
        // Eyes
        ctx.fillStyle = '#000';
        ctx.fillRect(e.x + 4, e.y + 4, 2, 2);
        ctx.fillRect(e.x + e.w - 6, e.y + 4, 2, 2);
      });

      // Draw Particles
      particles.forEach((p) => {
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, 2, 2);
      });

      // Overlay Screens
      if (gameState === 'START') {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
        ctx.fillRect(20, 40, W - 40, H - 80);
        ctx.strokeStyle = '#0058F8';
        ctx.lineWidth = 2;
        ctx.strokeRect(20, 40, W - 40, H - 80);

        ctx.fillStyle = '#F83800';
        ctx.font = 'bold 16px "Courier New", monospace';
        ctx.textAlign = 'center';
        ctx.fillText('CYBER DEFENDER', W / 2, 75);

        ctx.fillStyle = '#3C8CFC';
        ctx.font = '11px "Courier New", monospace';
        ctx.fillText('PROTOCOL INVADERS', W / 2, 95);

        ctx.fillStyle = '#FCFCFC';
        ctx.font = '10px "Courier New", monospace';
        ctx.fillText('DEFEND NETWORK FROM DDOS & MALWARE', W / 2, 125);
        ctx.fillText('[← / →] MOVE   [SPACE] FIRE', W / 2, 145);

        const blink = Math.floor(Date.now() / 400) % 2 === 0;
        if (blink) {
          ctx.fillStyle = '#F83800';
          ctx.fillText('INSERT COIN / PRESS SPACE TO PLAY', W / 2, 175);
        }
        ctx.textAlign = 'left';
      } else if (gameState === 'GAMEOVER') {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
        ctx.fillRect(30, 50, W - 60, H - 100);
        ctx.strokeStyle = '#F83800';
        ctx.lineWidth = 2;
        ctx.strokeRect(30, 50, W - 60, H - 100);

        ctx.fillStyle = '#F83800';
        ctx.font = 'bold 18px "Courier New", monospace';
        ctx.textAlign = 'center';
        ctx.fillText('SYSTEM COMPROMISED', W / 2, 90);

        ctx.fillStyle = '#FCFCFC';
        ctx.font = '12px "Courier New", monospace';
        ctx.fillText(`FINAL SCORE: ${score}`, W / 2, 120);

        const blink = Math.floor(Date.now() / 400) % 2 === 0;
        if (blink) {
          ctx.fillStyle = '#3C8CFC';
          ctx.fillText('PRESS SPACE TO REBOOT', W / 2, 150);
        }
        ctx.textAlign = 'left';
      } else if (gameState === 'PAUSE') {
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#FCFCFC';
        ctx.font = 'bold 16px "Courier New", monospace';
        ctx.textAlign = 'center';
        ctx.fillText('PAUSED', W / 2, H / 2);
        ctx.textAlign = 'left';
      }
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
