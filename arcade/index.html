<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CYBER DEFENDER: Protocol Invaders | Arvss07 Arcade</title>
  <style>
    :root {
      --bg: #000000;
      --paper: #FCFCFC;
      --blue: #0058F8;
      --blue-glow: #3C8CFC;
      --red: #F83800;
      --tint: #0B2B6B;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background-color: var(--bg);
      color: var(--paper);
      font-family: 'Courier New', Courier, monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      touch-action: manipulation;
    }
    #cabinet {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px;
      border: 4px solid var(--paper);
      background: #050b14;
      box-shadow: 0 0 25px rgba(0, 88, 248, 0.4), inset 0 0 20px rgba(0, 0, 0, 0.9);
      max-width: 100vw;
    }
    #marquee {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      background: var(--blue);
      color: var(--paper);
      padding: 6px 12px;
      margin-bottom: 8px;
      border: 2px solid var(--paper);
      font-weight: bold;
      font-size: 13px;
      letter-spacing: 1px;
    }
    #marquee .title {
      color: var(--paper);
      text-shadow: 2px 2px #000;
    }
    #marquee .actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    #marquee a, #marquee button {
      color: #A8C4FC;
      background: none;
      border: none;
      text-decoration: none;
      font-family: inherit;
      font-size: 11px;
      cursor: pointer;
      font-weight: bold;
    }
    #marquee a:hover, #marquee button:hover {
      color: #fff;
      text-decoration: underline;
    }
    #screen-wrap {
      position: relative;
      border: 4px solid #1a2638;
      background: #000;
      line-height: 0;
      overflow: hidden;
    }
    canvas {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      display: block;
      width: 640px;
      height: 480px;
      max-width: 95vw;
      max-height: 65vh;
      object-fit: contain;
    }
    /* CRT Scanline overlay */
    .crt-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.35) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
      background-size: 100% 4px, 6px 100%;
    }
    #controls-hint {
      margin-top: 8px;
      font-size: 11px;
      color: #A8C4FC;
      text-align: center;
      letter-spacing: 0.5px;
    }
    /* On-Screen Mobile Gamepad */
    #mobile-controls {
      display: none;
      width: 100%;
      max-width: 640px;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
      padding: 0 8px;
    }
    @media (pointer: coarse) {
      #mobile-controls {
        display: flex;
      }
      #controls-hint {
        display: none;
      }
    }
    .pad-btn {
      background: #111e33;
      color: var(--paper);
      border: 2px solid var(--blue-glow);
      font-size: 16px;
      font-weight: bold;
      width: 56px;
      height: 50px;
      border-radius: 6px;
      touch-action: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .pad-btn:active, .pad-btn.pressed {
      background: var(--red);
      border-color: var(--paper);
    }
    .fire-btn {
      background: #4a0f02;
      border-color: var(--red);
      width: 72px;
      height: 50px;
      font-size: 13px;
    }
    .bomb-btn {
      background: #2b1f05;
      border-color: #fca311;
      color: #fca311;
      width: 64px;
      height: 50px;
      font-size: 12px;
    }
    .btn-group {
      display: flex;
      gap: 8px;
    }
  </style>
</head>
<body>

  <div id="cabinet">
    <div id="marquee">
      <span class="title">🕹️ CYBER DEFENDER v2.0</span>
      <div class="actions">
        <button id="btn-sound-toggle">🔊 SOUND: ON</button>
        <a href="../README.md">← BOOKLET</a>
        <a href="https://github.com/Arvss07" target="_blank">GITHUB</a>
      </div>
    </div>

    <div id="screen-wrap">
      <canvas id="game" width="320" height="240"></canvas>
      <div class="crt-overlay"></div>
    </div>

    <div id="controls-hint">
      [← / →] MOVE &nbsp;&bull;&nbsp; [SPACE] FIRE &nbsp;&bull;&nbsp; [B] EMP BOMB &nbsp;&bull;&nbsp; [M] MUTE &nbsp;&bull;&nbsp; [ENTER] PAUSE
    </div>

    <div id="mobile-controls">
      <div class="btn-group">
        <button class="pad-btn" id="btn-left">◀</button>
        <button class="pad-btn" id="btn-right">▶</button>
      </div>
      <div class="btn-group">
        <button class="pad-btn bomb-btn" id="btn-bomb">EMP</button>
        <button class="pad-btn fire-btn" id="btn-fire">FIRE</button>
      </div>
    </div>
  </div>

  <script>
    // --- 8-BIT AUDIO SYNTHESIZER ---
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let actx = null;
    let soundEnabled = true;

    function initAudio() {
      if (!actx) actx = new AudioCtx();
      if (actx.state === 'suspended') actx.resume();
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      const btn = document.getElementById('btn-sound-toggle');
      if (btn) btn.textContent = soundEnabled ? '🔊 SOUND: ON' : '🔇 SOUND: OFF';
    }
    document.getElementById('btn-sound-toggle').addEventListener('click', () => {
      initAudio();
      toggleSound();
    });

    function playTone(freq, type = 'square', duration = 0.08, vol = 0.15) {
      if (!soundEnabled || !actx) return;
      try {
        const osc = actx.createOscillator();
        const gain = actx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, actx.currentTime);
        gain.gain.setValueAtTime(vol, actx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + duration);
        osc.connect(gain);
        gain.connect(actx.destination);
        osc.start();
        osc.stop(actx.currentTime + duration);
      } catch (e) {}
    }

    function soundLaser() {
      if (!soundEnabled || !actx) return;
      try {
        const osc = actx.createOscillator();
        const gain = actx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(880, actx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(110, actx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.1, actx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, actx.currentTime + 0.1);
        osc.connect(gain);
        gain.connect(actx.destination);
        osc.start();
        osc.stop(actx.currentTime + 0.1);
      } catch (e) {}
    }

    function soundExplode() {
      if (!soundEnabled || !actx) return;
      try {
        const osc = actx.createOscillator();
        const gain = actx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(140, actx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(30, actx.currentTime + 0.22);
        gain.gain.setValueAtTime(0.22, actx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, actx.currentTime + 0.22);
        osc.connect(gain);
        gain.connect(actx.destination);
        osc.start();
        osc.stop(actx.currentTime + 0.22);
      } catch (e) {}
    }

    function soundBomb() {
      if (!soundEnabled || !actx) return;
      try {
        const osc = actx.createOscillator();
        const gain = actx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(350, actx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(20, actx.currentTime + 0.6);
        gain.gain.setValueAtTime(0.3, actx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, actx.currentTime + 0.6);
        osc.connect(gain);
        gain.connect(actx.destination);
        osc.start();
        osc.stop(actx.currentTime + 0.6);
      } catch (e) {}
    }

    function soundHit() {
      playTone(110, 'square', 0.15, 0.25);
    }

    function soundDeflect() {
      playTone(660, 'sine', 0.08, 0.2);
    }

    function soundPowerup() {
      if (!soundEnabled || !actx) return;
      [330, 440, 550, 660].forEach((f, i) => {
        setTimeout(() => playTone(f, 'square', 0.07, 0.12), i * 50);
      });
    }

    function soundSiren() {
      if (!soundEnabled || !actx) return;
      [400, 520, 400, 520].forEach((f, i) => {
        setTimeout(() => playTone(f, 'sawtooth', 0.1, 0.15), i * 90);
      });
    }

    // --- GAME ENGINE CONSTANTS & STATE ---
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const W = 320;
    const H = 240;

    const THREAT_NAMES = [
      'PORT SCAN & SYN FLOOD',
      'TROJAN PAYLOAD INJECTION',
      'RANSOMWARE PROTOCOL',
      'APT-07: ZERO-DAY EXPLOIT (BOSS)',
      'DISTRIBUTED BOTNET SWARM',
      'ADVANCED THREAT ACTOR (BOSS)'
    ];

    let gameState = 'START'; // START, PLAY, GAMEOVER, PAUSE
    let score = 0;
    let highScore = parseInt(localStorage.getItem('arvss_high_score') || '0', 10);
    let wave = 1;
    let combo = 0;
    let comboTimer = 0;
    let packetsDeflected = 0;
    let waveBanner = '';
    let waveBannerTimer = 0;
    let screenShake = 0;
    let flashDamage = 0;

    // Player Terminal
    const player = {
      x: W / 2 - 10,
      y: H - 24,
      w: 22,
      h: 12,
      speed: 3,
      cooldown: 0,
      hp: 6,
      maxHp: 6,
      invuln: 0,
      bombs: 2,
      shield: false,
      spreadTime: 0
    };

    let bullets = [];
    let enemyBullets = [];
    let enemies = [];
    let particles = [];
    let powerups = [];
    let boss = null;

    // Binary matrix backdrop particles
    const matrixDrops = [];
    for (let i = 0; i < 28; i++) {
      matrixDrops.push({
        x: Math.floor(Math.random() * (W - 10)),
        y: Math.floor(Math.random() * H),
        speed: 0.4 + Math.random() * 0.8,
        char: Math.random() > 0.5 ? '1' : '0'
      });
    }

    // Enemy movement
    let enemyDir = 1;
    let enemySpeed = 0.5;

    function triggerBomb() {
      if (player.bombs <= 0 || gameState !== 'PLAY') return;
      player.bombs--;
      soundBomb();
      screenShake = 16;
      flashDamage = 6;

      // Vaporize bullets & damage all enemies
      enemyBullets.forEach((eb) => {
        for (let i = 0; i < 4; i++) {
          particles.push({ x: eb.x, y: eb.y, vx: (Math.random() - 0.5) * 4, vy: (Math.random() - 0.5) * 4, life: 12, color: '#3C8CFC' });
        }
      });
      enemyBullets = [];

      enemies.forEach((e) => {
        e.hp -= 2;
        if (e.hp <= 0) {
          e.dead = true;
          score += 20;
          packetsDeflected++;
        }
      });
      enemies = enemies.filter((e) => !e.dead);

      if (boss) {
        boss.hp -= 10;
        if (boss.hp <= 0) boss.dead = true;
      }
    }

    let waveQuota = 0;
    let waveKilled = 0;
    let spawnTimer = 0;

    function spawnRandomEnemy() {
      const rand = Math.random();
      let type, color, hp, w = 16, h = 12;
      let vx = (Math.random() - 0.5) * 1.6;
      let vy = 0.55 + Math.random() * 0.6 + wave * 0.08;
      let amp = 18 + Math.random() * 32;
      let freq = 0.04 + Math.random() * 0.04;

      if (rand < 0.42) {
        // DDOS: Fast sine-weaving packet
        type = 'DDOS';
        color = '#3C8CFC';
        hp = 1;
        vy *= 1.25;
      } else if (rand < 0.72) {
        // TROJAN: Tracking predator bug
        type = 'TROJAN';
        color = '#F83800';
        hp = 2;
        w = 18; h = 14;
      } else if (rand < 0.88) {
        // ROOTKIT: Armored stealth mainframe
        type = 'ROOTKIT';
        color = '#FCFCFC';
        hp = 3;
        w = 20; h = 14;
        vy *= 0.65;
      } else {
        // WORM: Fast diagonal flier
        type = 'WORM';
        color = '#fca311';
        hp = 1;
        w = 14; h = 10;
        vx = (Math.random() > 0.5 ? 1 : -1) * (1.5 + Math.random() * 0.8);
      }

      const x = 20 + Math.random() * (W - 40 - w);
      enemies.push({
        x,
        y: -18 - Math.random() * 25,
        baseX: x,
        w,
        h,
        type,
        color,
        hp,
        maxHp: hp,
        vx,
        vy,
        amp,
        freq,
        t: Math.random() * 20,
        shootTimer: 35 + Math.floor(Math.random() * 75)
      });
    }

    function spawnWave() {
      enemies = [];
      boss = null;
      const isBossWave = wave % 4 === 0;
      waveBanner = isBossWave ? 'CRITICAL ALERT: APT ROOTKIT DETECTED!' : `STAGE ${wave}: ${THREAT_NAMES[(wave - 1) % THREAT_NAMES.length]}`;
      waveBannerTimer = 110;

      if (isBossWave) {
        soundSiren();
        boss = {
          x: W / 2 - 28,
          y: 36,
          w: 56,
          h: 24,
          hp: 35 + wave * 5,
          maxHp: 35 + wave * 5,
          dir: 1,
          speed: 1.1,
          shootCooldown: 30
        };
      } else {
        waveQuota = 12 + wave * 4;
        waveKilled = 0;
        spawnTimer = 5;
      }
    }

    function resetGame() {
      score = 0;
      wave = 1;
      combo = 0;
      packetsDeflected = 0;
      player.hp = 6;
      player.maxHp = 6;
      player.bombs = 2;
      player.shield = false;
      player.spreadTime = 0;
      player.invuln = 0;
      player.x = W / 2 - 11;
      bullets = [];
      enemyBullets = [];
      particles = [];
      powerups = [];
      spawnWave();
      gameState = 'PLAY';
    }

    // --- INPUT HANDLING ---
    const keys = { left: false, right: false, fire: false };
    window.addEventListener('keydown', (e) => {
      initAudio();
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
      if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
      if (e.code === 'Space') {
        keys.fire = true;
        if (gameState === 'START' || gameState === 'GAMEOVER') resetGame();
      }
      if (e.code === 'KeyB') triggerBomb();
      if (e.code === 'Enter') {
        if (gameState === 'START' || gameState === 'GAMEOVER') resetGame();
        else if (gameState === 'PLAY') gameState = 'PAUSE';
        else if (gameState === 'PAUSE') gameState = 'PLAY';
      }
      if (e.code === 'KeyM') toggleSound();
    });

    window.addEventListener('keyup', (e) => {
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
      if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
      if (e.code === 'Space') keys.fire = false;
    });

    function bindTouch(id, action) {
      const el = document.getElementById(id);
      if (!el) return;
      const press = (e) => {
        e.preventDefault();
        initAudio();
        if (action === 'left') keys.left = true;
        else if (action === 'right') keys.right = true;
        else if (action === 'fire') {
          keys.fire = true;
          if (gameState !== 'PLAY') resetGame();
        } else if (action === 'bomb') triggerBomb();
        el.classList.add('pressed');
      };
      const release = (e) => {
        e.preventDefault();
        if (action === 'left') keys.left = false;
        else if (action === 'right') keys.right = false;
        else if (action === 'fire') keys.fire = false;
        el.classList.remove('pressed');
      };
      el.addEventListener('touchstart', press);
      el.addEventListener('touchend', release);
      el.addEventListener('mousedown', press);
      el.addEventListener('mouseup', release);
    }
    bindTouch('btn-left', 'left');
    bindTouch('btn-right', 'right');
    bindTouch('btn-fire', 'fire');
    bindTouch('btn-bomb', 'bomb');

    function explode(x, y, color, count = 12) {
      for (let i = 0; i < count; i++) {
        particles.push({
          x, y,
          vx: (Math.random() - 0.5) * 4.5,
          vy: (Math.random() - 0.5) * 4.5,
          life: 16 + Math.random() * 8,
          color
        });
      }
    }

    // --- GAME UPDATE ---
    function update() {
      // Matrix drops
      matrixDrops.forEach((d) => {
        d.y += d.speed;
        if (d.y > H) {
          d.y = 0;
          d.x = Math.floor(Math.random() * W);
          d.char = Math.random() > 0.5 ? '1' : '0';
        }
      });

      if (screenShake > 0) screenShake--;
      if (flashDamage > 0) flashDamage--;

      if (gameState !== 'PLAY') return;

      if (waveBannerTimer > 0) waveBannerTimer--;
      if (player.invuln > 0) player.invuln--;
      if (player.spreadTime > 0) player.spreadTime--;

      // Combo cooldown
      if (comboTimer > 0) {
        comboTimer--;
        if (comboTimer === 0) combo = 0;
      }

      // Player move
      if (keys.left && player.x > 8) player.x -= player.speed;
      if (keys.right && player.x < W - player.w - 8) player.x += player.speed;

      // Player shoot
      if (player.cooldown > 0) player.cooldown--;
      if (keys.fire && player.cooldown === 0) {
        if (player.spreadTime > 0) {
          // Double spread shot
          bullets.push({ x: player.x + 3, y: player.y - 4, w: 2, h: 7, vy: -5.5, vx: -0.6 });
          bullets.push({ x: player.x + player.w - 5, y: player.y - 4, w: 2, h: 7, vy: -5.5, vx: 0.6 });
        } else {
          // Single laser
          bullets.push({ x: player.x + player.w / 2 - 1, y: player.y - 4, w: 3, h: 8, vy: -5.5, vx: 0 });
        }
        player.cooldown = 11;
        soundLaser();
      }

      // Update bullets
      bullets.forEach((b) => {
        b.y += b.vy;
        b.x += b.vx || 0;
      });
      bullets = bullets.filter((b) => b.y > 0 && b.x > 0 && b.x < W);

      // --- BOSS LOGIC ---
      if (boss) {
        boss.x += boss.dir * boss.speed;
        if (boss.x < 12 || boss.x > W - boss.w - 12) boss.dir *= -1;

        boss.shootCooldown--;
        if (boss.shootCooldown <= 0) {
          boss.shootCooldown = 28;
          enemyBullets.push({ x: boss.x + 8, y: boss.y + boss.h, w: 3, h: 6, vy: 2.2 });
          enemyBullets.push({ x: boss.x + boss.w / 2, y: boss.y + boss.h, w: 3, h: 7, vy: 2.6 });
          enemyBullets.push({ x: boss.x + boss.w - 10, y: boss.y + boss.h, w: 3, h: 6, vy: 2.2 });
        }

        // Bullets vs Boss
        bullets.forEach((b) => {
          if (!b.dead && b.x < boss.x + boss.w && b.x + b.w > boss.x && b.y < boss.y + boss.h && b.y + b.h > boss.y) {
            b.dead = true;
            boss.hp--;
            explode(b.x, b.y, '#F83800', 3);
            playTone(320, 'square', 0.03);
            if (boss.hp <= 0) {
              explode(boss.x + boss.w / 2, boss.y + boss.h / 2, '#F83800', 35);
              explode(boss.x + boss.w / 2, boss.y + boss.h / 2, '#3C8CFC', 25);
              soundExplode();
              score += 250 + wave * 50;
              packetsDeflected += 10;
              screenShake = 14;
              boss = null;
              wave++;
              soundPowerup();
              setTimeout(spawnWave, 600);
            }
          }
        });
      }

      // Continuous dynamic threat spawner
      if (!boss && (waveKilled + enemies.length < waveQuota)) {
        spawnTimer--;
        if (spawnTimer <= 0 && enemies.length < 8) {
          spawnRandomEnemy();
          spawnTimer = Math.max(16, 50 - wave * 4 + Math.floor(Math.random() * 25));
        }
      }

      // --- DYNAMIC INDIVIDUAL ENEMY FLIGHT & TACTICS ---
      enemies.forEach((e) => {
        e.t += 0.05;

        if (e.type === 'DDOS') {
          // Sine-wave trajectory
          e.y += e.vy;
          e.baseX += e.vx;
          if (e.baseX < 15 || e.baseX > W - e.w - 15) e.vx *= -1;
          e.x = e.baseX + Math.sin(e.t) * e.amp;
        } else if (e.type === 'TROJAN') {
          // Tracking hunter
          e.y += e.vy;
          if (player.x > e.x + 3) e.x += 0.75;
          else if (player.x < e.x - 3) e.x -= 0.75;
        } else if (e.type === 'ROOTKIT') {
          // Slow armored sweep
          e.y += e.vy;
          e.x += Math.sin(e.t * 0.6) * 1.4;
        } else if (e.type === 'WORM') {
          // Fast diagonal bounce
          e.y += e.vy;
          e.x += e.vx;
          if (e.x < 10 || e.x > W - e.w - 10) e.vx *= -1;
        }

        // Clamp inside screen bounds
        if (e.x < 6) e.x = 6;
        if (e.x > W - e.w - 6) e.x = W - e.w - 6;

        // Individual firing
        e.shootTimer--;
        if (e.shootTimer <= 0) {
          e.shootTimer = 65 + Math.floor(Math.random() * 85);
          if (e.y > 10 && e.y < H - 45) {
            enemyBullets.push({ x: e.x + e.w / 2 - 1, y: e.y + e.h, w: 2, h: 6, vy: 2.2 + wave * 0.1 });
          }
        }

        // Loop from bottom back to top
        if (e.y > H + 10) {
          e.y = -18;
          e.x = 20 + Math.random() * (W - 40 - e.w);
          e.baseX = e.x;
        }

        // Physical collision with player terminal
        if (player.invuln === 0 && e.x < player.x + player.w && e.x + e.w > player.x && e.y < player.y + player.h && e.y + e.h > player.y) {
          e.dead = true;
          waveKilled++;
          explode(e.x + e.w / 2, e.y + e.h / 2, e.color, 18);
          if (player.shield) {
            player.shield = false;
            player.invuln = 45;
            soundDeflect();
          } else {
            player.hp--;
            player.invuln = 60;
            screenShake = 10;
            flashDamage = 5;
            soundHit();
            if (player.hp <= 0) {
              soundExplode();
              gameState = 'GAMEOVER';
            }
          }
        }
      });

      // Enemy bullets move
      enemyBullets.forEach((eb) => eb.y += eb.vy);
      enemyBullets = enemyBullets.filter((eb) => eb.y < H);

      // Bullets vs Enemies
      bullets.forEach((b) => {
        if (b.dead) return;
        enemies.forEach((e) => {
          if (!b.dead && !e.dead && b.x < e.x + e.w && b.x + b.w > e.x && b.y < e.y + e.h && b.y + b.h > e.y) {
            b.dead = true;
            e.hp--;
            if (e.hp <= 0) {
              e.dead = true;
              waveKilled++;
              explode(e.x + e.w / 2, e.y + e.h / 2, e.color, 14);
              soundExplode();
              packetsDeflected++;
              combo++;
              comboTimer = 70;
              const points = (e.type === 'ROOTKIT' ? 50 : (e.type === 'TROJAN' ? 30 : 15)) * Math.min(4, combo);
              score += points;

              if (score > highScore) {
                highScore = score;
                localStorage.setItem('arvss_high_score', highScore);
              }

              // Powerup drop chance
              const roll = Math.random();
              if (roll < 0.07) {
                powerups.push({ x: e.x, y: e.y, vy: 1.4, type: 'PATCH' });
              } else if (roll < 0.12) {
                powerups.push({ x: e.x, y: e.y, vy: 1.4, type: 'SPREAD' });
              } else if (roll < 0.16) {
                powerups.push({ x: e.x, y: e.y, vy: 1.4, type: 'SHIELD' });
              } else if (roll < 0.19) {
                powerups.push({ x: e.x, y: e.y, vy: 1.4, type: 'BOMB' });
              }
            } else {
              explode(b.x, b.y, '#fff', 3);
              playTone(200, 'square', 0.04);
            }
          }
        });
      });
      bullets = bullets.filter((b) => !b.dead);
      enemies = enemies.filter((e) => !e.dead);

      // Powerups update
      powerups.forEach((p) => {
        p.y += p.vy;
        if (p.x < player.x + player.w && p.x + 12 > player.x && p.y < player.y + player.h && p.y + 12 > player.y) {
          p.collected = true;
          soundPowerup();
          if (p.type === 'PATCH') {
            player.hp = Math.min(player.maxHp, player.hp + 2);
          } else if (p.type === 'SPREAD') {
            player.spreadTime = 300;
          } else if (p.type === 'SHIELD') {
            player.shield = true;
          } else if (p.type === 'BOMB') {
            player.bombs = Math.min(4, player.bombs + 1);
          }
        }
      });
      powerups = powerups.filter((p) => !p.collected && p.y < H);

      // Enemy Bullets vs Player
      enemyBullets.forEach((eb) => {
        if (!eb.dead && player.invuln === 0 && eb.x < player.x + player.w && eb.x + eb.w > player.x && eb.y < player.y + player.h && eb.y + eb.h > player.y) {
          eb.dead = true;
          if (player.shield) {
            player.shield = false;
            player.invuln = 45;
            soundDeflect();
            explode(player.x + player.w / 2, player.y + player.h / 2, '#3C8CFC', 14);
          } else {
            player.hp--;
            player.invuln = 60;
            screenShake = 8;
            flashDamage = 4;
            soundHit();
            explode(player.x + player.w / 2, player.y + player.h / 2, '#F83800', 16);
            if (player.hp <= 0) {
              soundExplode();
              gameState = 'GAMEOVER';
            }
          }
        }
      });
      enemyBullets = enemyBullets.filter((eb) => !eb.dead);

      // Wave cleared
      if (!boss && waveKilled >= waveQuota && enemies.length === 0) {
        wave++;
        soundPowerup();
        spawnWave();
      }

      // Particles physics
      particles.forEach((p) => {
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
      });
      particles = particles.filter((p) => p.life > 0);
    }

    // --- DRAW HUD & GRAPHICS ---
    function draw() {
      ctx.save();

      // Screen Shake
      if (screenShake > 0) {
        const sx = (Math.random() - 0.5) * 4;
        const sy = (Math.random() - 0.5) * 4;
        ctx.translate(sx, sy);
      }

      // Clear Screen
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, W, H);

      // Binary Data Stream Background
      ctx.fillStyle = '#0B2B6B';
      ctx.font = '8px "Courier New", monospace';
      matrixDrops.forEach((d) => {
        ctx.fillText(d.char, d.x, d.y);
      });

      // Subtle horizontal cyber grid line
      ctx.strokeStyle = '#051b3b';
      ctx.lineWidth = 1;
      for (let y = 30; y < H; y += 24) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(W, y);
        ctx.stroke();
      }

      // ====================================================
      // TOP HUD & SEGMENTED HEALTH BARS
      // ====================================================

      // Header Panel Bar
      ctx.fillStyle = '#050c18';
      ctx.fillRect(0, 0, W, 26);
      ctx.strokeStyle = '#1b2a4a';
      ctx.strokeRect(0, 0, W, 26);

      // Score & High Score
      ctx.fillStyle = '#FCFCFC';
      ctx.font = 'bold 9px "Courier New", monospace';
      ctx.fillText(`SCORE:${score}`, 8, 11);
      ctx.fillStyle = '#A8C4FC';
      ctx.fillText(`HI:${highScore}`, 85, 11);
      ctx.fillText(`WV:${wave}`, 155, 11);

      // Bombs indicator
      ctx.fillStyle = '#fca311';
      ctx.fillText(`EMP:`, 190, 11);
      for (let i = 0; i < player.bombs; i++) {
        ctx.fillRect(212 + i * 8, 4, 6, 7);
      }

      // Segmented Player Firewall Integrity (Health Bar)
      ctx.fillStyle = '#FCFCFC';
      ctx.fillText(`FW:`, 245, 11);
      const barX = 265;
      const barY = 4;
      const cellW = 7;
      const cellH = 7;
      const gap = 2;
      for (let i = 0; i < player.maxHp; i++) {
        if (i < player.hp) {
          // Color based on critical status
          ctx.fillStyle = player.hp <= 2 ? '#F83800' : '#0058F8';
          ctx.fillRect(barX + i * (cellW + gap), barY, cellW, cellH);
          ctx.fillStyle = '#FCFCFC';
          ctx.fillRect(barX + i * (cellW + gap) + 1, barY + 1, 2, 2);
        } else {
          ctx.fillStyle = '#0B2B6B';
          ctx.fillRect(barX + i * (cellW + gap), barY, cellW, cellH);
        }
      }

      // Combo indicator
      if (combo > 1) {
        ctx.fillStyle = '#fca311';
        ctx.font = 'bold 8px "Courier New", monospace';
        ctx.fillText(`COMBO x${combo}!`, 8, 22);
      } else {
        ctx.fillStyle = '#3C8CFC';
        ctx.font = '8px "Courier New", monospace';
        ctx.fillText(`DEFLECTED: ${packetsDeflected}`, 8, 22);
      }
      if (!boss) {
        ctx.fillStyle = '#A8C4FC';
        ctx.font = '8px "Courier New", monospace';
        ctx.fillText(`THREATS: ${Math.max(0, waveQuota - waveKilled)}`, 85, 22);
      }

      // Powerup active timer
      if (player.spreadTime > 0) {
        ctx.fillStyle = '#0058F8';
        ctx.fillText(`SPREAD LASER: ${Math.ceil(player.spreadTime / 60)}s`, 155, 22);
      } else if (player.shield) {
        ctx.fillStyle = '#3C8CFC';
        ctx.fillText(`SSL SHIELD: ACTIVE`, 155, 22);
      }

      // ====================================================
      // BOSS HEALTH BAR (WHEN ACTIVE)
      // ====================================================
      if (boss) {
        const bossBarW = 160;
        const bossBarX = (W - bossBarW) / 2;
        const bossBarY = 28;

        ctx.fillStyle = '#F83800';
        ctx.font = 'bold 8px "Courier New", monospace';
        ctx.textAlign = 'center';
        ctx.fillText(`BOSS: ROOTKIT APT-07 [${Math.ceil((boss.hp / boss.maxHp) * 100)}%]`, W / 2, bossBarY - 1);
        ctx.textAlign = 'left';

        // Outer box
        ctx.strokeStyle = '#F83800';
        ctx.strokeRect(bossBarX - 2, bossBarY, bossBarW + 4, 8);

        // Segmented cells inside boss bar
        const totalPips = 20;
        const activePips = Math.ceil((boss.hp / boss.maxHp) * totalPips);
        const pipW = Math.floor(bossBarW / totalPips) - 1;
        for (let i = 0; i < totalPips; i++) {
          ctx.fillStyle = i < activePips ? '#F83800' : '#1b0505';
          ctx.fillRect(bossBarX + i * (pipW + 1), bossBarY + 1, pipW, 6);
        }
      }

      // Wave Entrance Alert Banner
      if (waveBannerTimer > 0) {
        ctx.fillStyle = 'rgba(0, 20, 50, 0.85)';
        ctx.fillRect(10, 80, W - 20, 28);
        ctx.strokeStyle = '#3C8CFC';
        ctx.strokeRect(10, 80, W - 20, 28);
        ctx.fillStyle = wave % 4 === 0 ? '#F83800' : '#FCFCFC';
        ctx.font = 'bold 10px "Courier New", monospace';
        ctx.textAlign = 'center';
        ctx.fillText(waveBanner, W / 2, 97);
        ctx.textAlign = 'left';
      }

      // ====================================================
      // DRAW ENTITIES
      // ====================================================

      // Bullets
      bullets.forEach((b) => {
        ctx.fillStyle = '#F83800';
        ctx.fillRect(b.x, b.y, b.w, b.h);
        ctx.fillStyle = '#FCFCFC';
        ctx.fillRect(b.x + 1, b.y + 1, 1, 3);
      });

      // Enemy Bullets
      enemyBullets.forEach((eb) => {
        ctx.fillStyle = '#3C8CFC';
        ctx.fillRect(eb.x, eb.y, eb.w, eb.h);
        ctx.fillStyle = '#FCFCFC';
        ctx.fillRect(eb.x, eb.y, eb.w, 2);
      });

      // Powerups
      powerups.forEach((p) => {
        ctx.fillStyle = p.type === 'PATCH' ? '#F83800' : (p.type === 'SHIELD' ? '#3C8CFC' : '#fca311');
        ctx.fillRect(p.x, p.y, 12, 12);
        ctx.fillStyle = '#000';
        ctx.font = 'bold 8px "Courier New", monospace';
        const glyph = p.type === 'PATCH' ? '+' : (p.type === 'SHIELD' ? 'S' : (p.type === 'SPREAD' ? '2' : 'B'));
        ctx.fillText(glyph, p.x + 3, p.y + 9);
      });

      // Enemies (Unique sprites per randomized threat type)
      enemies.forEach((e) => {
        ctx.fillStyle = e.color;

        if (e.type === 'DDOS') {
          // Fast chevron / delta packet sprite
          ctx.fillRect(e.x + 4, e.y, e.w - 8, 3);
          ctx.fillRect(e.x + 2, e.y + 3, e.w - 4, 3);
          ctx.fillRect(e.x, e.y + 6, e.w, 3);
          ctx.fillRect(e.x + 3, e.y + 9, 3, 3);
          ctx.fillRect(e.x + e.w - 6, e.y + 9, 3, 3);
          ctx.fillStyle = '#FCFCFC';
          ctx.fillRect(e.x + e.w / 2 - 1, e.y + 3, 2, 4);
        } else if (e.type === 'TROJAN') {
          // Predator bug with twitching legs
          ctx.fillRect(e.x + 3, e.y, e.w - 6, 3);
          ctx.fillRect(e.x + 2, e.y + 3, e.w - 4, 6);
          ctx.fillRect(e.x, e.y + 2, 2, 4);
          ctx.fillRect(e.x + e.w - 2, e.y + 2, 2, 4);
          ctx.fillRect(e.x + 2, e.y + 9, 3, 4);
          ctx.fillRect(e.x + e.w - 5, e.y + 9, 3, 4);
          ctx.fillStyle = '#000';
          ctx.fillRect(e.x + 4, e.y + 4, 2, 2);
          ctx.fillRect(e.x + e.w - 6, e.y + 4, 2, 2);
        } else if (e.type === 'ROOTKIT') {
          // Armored mainframe skull
          ctx.fillRect(e.x + 2, e.y, e.w - 4, 3);
          ctx.fillRect(e.x, e.y + 3, e.w, 7);
          ctx.fillRect(e.x + 3, e.y + 10, e.w - 6, 3);
          ctx.fillStyle = '#F83800';
          ctx.fillRect(e.x + 4, e.y + 5, 3, 3);
          ctx.fillRect(e.x + e.w - 7, e.y + 5, 3, 3);
          // Armor health pips on top
          for (let p = 0; p < e.hp; p++) {
            ctx.fillStyle = '#0058F8';
            ctx.fillRect(e.x + 3 + p * 5, e.y - 3, 4, 2);
          }
        } else {
          // WORM: Segmented digital cyber-worm
          ctx.fillRect(e.x + 2, e.y, e.w - 4, 3);
          ctx.fillRect(e.x, e.y + 3, e.w, 4);
          ctx.fillRect(e.x + 3, e.y + 7, e.w - 6, 3);
          ctx.fillStyle = '#FCFCFC';
          ctx.fillRect(e.x + 4, e.y + 1, 2, 2);
          ctx.fillRect(e.x + e.w - 6, e.y + 1, 2, 2);
        }
      });

      // Boss
      if (boss) {
        ctx.fillStyle = '#F83800';
        // Massive 8-bit boss ship
        ctx.fillRect(boss.x + 10, boss.y, boss.w - 20, 6);
        ctx.fillRect(boss.x + 4, boss.y + 6, boss.w - 8, 10);
        ctx.fillRect(boss.x, boss.y + 12, boss.w, 8);
        ctx.fillRect(boss.x + 6, boss.y + 20, 8, 4);
        ctx.fillRect(boss.x + boss.w - 14, boss.y + 20, 8, 4);
        // Boss Core
        ctx.fillStyle = '#FCFCFC';
        ctx.fillRect(boss.x + boss.w / 2 - 5, boss.y + 8, 10, 6);
        ctx.fillStyle = '#3C8CFC';
        ctx.fillRect(boss.x + boss.w / 2 - 3, boss.y + 10, 6, 2);
      }

      // Draw Player Terminal
      const showPlayer = player.invuln === 0 || Math.floor(player.invuln / 4) % 2 === 0;
      if (showPlayer) {
        ctx.fillStyle = '#0058F8';
        ctx.fillRect(player.x, player.y + 4, player.w, player.h - 4);
        ctx.fillStyle = '#3C8CFC';
        ctx.fillRect(player.x + 4, player.y, player.w - 8, 4);
        ctx.fillStyle = '#FCFCFC';
        ctx.fillRect(player.x + 8, player.y + 6, 6, 3);
        // Turret tips
        ctx.fillStyle = '#F83800';
        ctx.fillRect(player.x + 2, player.y + 2, 3, 3);
        ctx.fillRect(player.x + player.w - 5, player.y + 2, 3, 3);

        // Shield Bubble
        if (player.shield) {
          ctx.strokeStyle = '#3C8CFC';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.arc(player.x + player.w / 2, player.y + player.h / 2, 16, 0, Math.PI * 2);
          ctx.stroke();
        }
      }

      // Particles
      particles.forEach((p) => {
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, 2, 2);
      });

      // Hit damage flash
      if (flashDamage > 0) {
        ctx.fillStyle = 'rgba(248, 56, 0, 0.25)';
        ctx.fillRect(0, 0, W, H);
      }

      // ====================================================
      // START & GAMEOVER SCREENS
      // ====================================================
      if (gameState === 'START') {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.88)';
        ctx.fillRect(20, 36, W - 40, H - 65);
        ctx.strokeStyle = '#0058F8';
        ctx.lineWidth = 2;
        ctx.strokeRect(20, 36, W - 40, H - 65);

        ctx.fillStyle = '#F83800';
        ctx.font = 'bold 16px "Courier New", monospace';
        ctx.textAlign = 'center';
        ctx.fillText('CYBER DEFENDER', W / 2, 68);

        ctx.fillStyle = '#3C8CFC';
        ctx.font = 'bold 10px "Courier New", monospace';
        ctx.fillText('PROTOCOL INVADERS · RETRO ARCADE', W / 2, 84);

        ctx.fillStyle = '#FCFCFC';
        ctx.font = '9px "Courier New", monospace';
        ctx.fillText('DEFEND NETWORK CORE FROM MALICIOUS THREATS', W / 2, 110);
        ctx.fillText('[← / →] MOVE   [SPACE] FIRE LASER', W / 2, 126);
        ctx.fillText('[B] EMP BOMB   [M] MUTE SOUND', W / 2, 140);

        // Powerup tutorial icons
        ctx.fillStyle = '#3C8CFC';
        ctx.fillText('[+] REPAIR   [S] SSL SHIELD   [2] MULTI-BEAM', W / 2, 158);

        const blink = Math.floor(Date.now() / 400) % 2 === 0;
        if (blink) {
          ctx.fillStyle = '#F83800';
          ctx.font = 'bold 11px "Courier New", monospace';
          ctx.fillText('INSERT COIN: PRESS SPACE TO START', W / 2, 185);
        }
        ctx.textAlign = 'left';
      } else if (gameState === 'GAMEOVER') {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.88)';
        ctx.fillRect(25, 45, W - 50, H - 85);
        ctx.strokeStyle = '#F83800';
        ctx.lineWidth = 2;
        ctx.strokeRect(25, 45, W - 50, H - 85);

        ctx.fillStyle = '#F83800';
        ctx.font = 'bold 18px "Courier New", monospace';
        ctx.textAlign = 'center';
        ctx.fillText('SYSTEM BREACHED', W / 2, 80);

        ctx.fillStyle = '#FCFCFC';
        ctx.font = '11px "Courier New", monospace';
        ctx.fillText(`FINAL SCORE: ${score}`, W / 2, 105);
        ctx.fillText(`PACKETS BLOCKED: ${packetsDeflected}`, W / 2, 122);
        ctx.fillText(`HIGH SCORE: ${highScore}`, W / 2, 139);

        const blink = Math.floor(Date.now() / 400) % 2 === 0;
        if (blink) {
          ctx.fillStyle = '#3C8CFC';
          ctx.font = 'bold 11px "Courier New", monospace';
          ctx.fillText('PRESS SPACE TO REBOOT FIREWALL', W / 2, 168);
        }
        ctx.textAlign = 'left';
      } else if (gameState === 'PAUSE') {
        ctx.fillStyle = 'rgba(0,0,0,0.65)';
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#FCFCFC';
        ctx.font = 'bold 16px "Courier New", monospace';
        ctx.textAlign = 'center';
        ctx.fillText('PAUSED', W / 2, H / 2);
        ctx.textAlign = 'left';
      }

      ctx.restore();
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
